name: Validate Backend Structure

on:
  push:
    branches:
      - '**'   # run on push to any branch
  pull_request:
    branches:
      - '**'   # run on PR from any branch

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install dependencies
        run: npm install

      - name: Validate backend structure
        run: npm run validate